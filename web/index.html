<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0c100d">
<meta name="description" content="Termoak: sign in to manage your SSH sessions, teams and account.">
<meta name="robots" content="noindex">
<title>Termoak</title>
<link rel="icon" href="/assets/icon.svg?v={{VERSION}}" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/base.css?v={{VERSION}}">
<link rel="stylesheet" href="/assets/css/components.css?v={{VERSION}}">

<body>
<div id="app">
  <div class="boot" role="status">
    <img class="boot-logo" src="/assets/icon.svg?v={{VERSION}}" alt="" width="56" height="56">

  </div>
</div>
<div id="toasts" class="toasts" role="status" aria-live="polite" aria-relevant="additions"></div>
